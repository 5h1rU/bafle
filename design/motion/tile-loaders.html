<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bafle · una baldosa que carga</title>
<style>
  :root {
    --canvas: #fbf6fa; --panel: #f3eaf1; --ink: #241420; --muted: #6e5c6a;
    --line: #e4d6e1; --accent: #6b2560; --wash: #efdfec;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #160f15; --panel: #211720; --ink: #f4e9f1; --muted: #b7a6b3; --line: #3a2b37; --accent: #e6b3dc; --wash: #3a2036; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem 1rem 3rem; background: var(--canvas); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.375rem; letter-spacing: -.02em; }
  p.lead { margin: 0 0 1.25rem; color: var(--muted); font-size: .9375rem; max-width: 40rem; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  button.pill {
    height: 2.75rem; padding: 0 1rem; border: 0; border-radius: 99px; background: var(--wash); color: var(--accent);
    font: inherit; font-weight: 650; font-size: .875rem; cursor: pointer; touch-action: manipulation;
  }
  button.pill[aria-pressed="true"] { background: var(--accent); color: var(--canvas); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 1.75rem 1rem; max-width: 46rem; }
  .option { min-width: 0; }
  .tile {
    position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .stage { position: relative; aspect-ratio: 1; perspective: 38rem; }
  .cover {
    position: absolute; inset: 0; border-radius: .625rem; overflow: hidden; background: #2a1830;
    box-shadow: 0 1px 2px rgb(22 15 21 / 18%), 0 6px 18px rgb(22 15 21 / 14%);
    transform-origin: 50% 50%; will-change: transform;
    transition: transform 320ms cubic-bezier(.23, 1, .32, 1), filter 320ms ease-out, box-shadow 320ms ease-out;
  }
  .cover svg { display: block; width: 100%; height: 100%; }
  .name { margin: .625rem 0 0; font-weight: 650; font-size: .9375rem; letter-spacing: -.01em; }
  .what { margin: .125rem 0 0; color: var(--muted); font-size: .8125rem; }
  .tile:active .cover { transform: scale(.96); transition-duration: 90ms; }

  /* What every option ends in: the page opens. Here the tile simply grows and
     clears, which stands for the cover's flight to the head of its page. */
  .tile[data-state="opening"] .cover {
    transform: scale(1.18); opacity: 0;
    transition: transform 360ms cubic-bezier(.23, 1, .32, 1), opacity 260ms ease-in 80ms;
  }
  .tile[data-state="opening"] .extra { opacity: 0; transition: opacity 120ms; }

  /* 0 · What the app does today: a spinner over the picture. */
  .spinner {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: .625rem;
    background: rgb(22 15 21 / 45%); opacity: 0; transition: opacity 150ms;
  }
  .spinner::after {
    content: ""; width: 1.75rem; height: 1.75rem; border-radius: 50%;
    border: 3px solid rgb(255 255 255 / 35%); border-top-color: white; animation: spin 800ms linear infinite;
  }
  [data-kind="spinner"][data-state="loading"] .spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 1 · Respira: the press does not let go. The cover stays pressed in and
     breathes there, and comes back out as its page opens. */
  [data-kind="breathe"][data-state="loading"] .cover { animation: breathe 1150ms ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(.955); filter: brightness(.92); }
    50% { transform: scale(.985); filter: brightness(1.04); }
  }

  /* 2 · Balanceo: the sleeve is picked up and turns a little from side to
     side, as a record held up to be looked at. */
  [data-kind="sway"][data-state="loading"] .cover {
    animation: sway 1700ms cubic-bezier(.45, 0, .55, 1) infinite;
    box-shadow: 0 2px 4px rgb(22 15 21 / 20%), 0 14px 30px rgb(22 15 21 / 26%);
  }
  @keyframes sway {
    0%, 100% { transform: translateY(-3%) scale(1.03) rotateY(-13deg) rotateX(3deg); }
    50% { transform: translateY(-3%) scale(1.03) rotateY(13deg) rotateX(-3deg); }
  }

  /* 3 · Brillo: the cover lifts a little and a light crosses it, again and
     again, as light crosses a glossy sleeve that is tilted. */
  .sheen { position: absolute; inset: 0; border-radius: .625rem; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 150ms; }
  .sheen::after {
    content: ""; position: absolute; inset: -30% -60%;
    background: linear-gradient(105deg, transparent 38%, rgb(255 255 255 / 0%) 42%, rgb(255 255 255 / 55%) 50%, rgb(255 255 255 / 0%) 58%, transparent 62%);
    transform: translateX(-70%);
  }
  [data-kind="sheen"][data-state="loading"] .cover { transform: scale(1.035); }
  [data-kind="sheen"][data-state="loading"] .sheen { opacity: 1; transform: scale(1.035); }
  [data-kind="sheen"][data-state="loading"] .sheen::after { animation: sheen 1250ms cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes sheen { to { transform: translateX(70%); } }

  /* 4 · Disco: the record comes a little way out of its sleeve and turns
     while the page is fetched, and goes back in as it opens. */
  .disc {
    position: absolute; inset: 4%; border-radius: 50%; opacity: 0;
    background:
      radial-gradient(circle, #efdfec 0 9%, #6b2560 9.5% 17%, #0d090c 17.5% 100%);
    transition: transform 420ms cubic-bezier(.23, 1, .32, 1), opacity 120ms;
  }
  .disc::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, rgb(255 255 255 / 0%) 0 8%, rgb(255 255 255 / 22%) 12%, rgb(255 255 255 / 0%) 18% 55%, rgb(255 255 255 / 16%) 62%, rgb(255 255 255 / 0%) 70% 100%);
  }
  [data-kind="disc"][data-state="loading"] .disc { opacity: 1; transform: translateX(34%); }
  [data-kind="disc"][data-state="loading"] .disc::after { animation: spin 1400ms linear infinite; }
  [data-kind="disc"][data-state="loading"] .cover { transform: translateX(-6%); }

  /* 5 · Sube: the cover rises off the shelf and hovers, tilted towards the
     listener, with its shadow growing under it. */
  [data-kind="lift"][data-state="loading"] .cover { animation: lift 1500ms ease-in-out infinite; }
  @keyframes lift {
    0%, 100% { transform: translateY(-4%) scale(1.04) rotateX(7deg); box-shadow: 0 3px 5px rgb(22 15 21 / 18%), 0 18px 28px rgb(22 15 21 / 24%); }
    50% { transform: translateY(-7%) scale(1.055) rotateX(2deg); box-shadow: 0 4px 6px rgb(22 15 21 / 14%), 0 28px 36px rgb(22 15 21 / 20%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cover, .disc, .sheen::after, .spinner::after { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>Una baldosa que carga</h1>
  <p class="lead">Toca una baldosa: carga durante unos segundos y luego “abre” su página. La primera es el spinner de hoy; las demás usan solo transformaciones de la propia carátula.</p>
  <div class="bar">
    <button class="pill" id="all" aria-pressed="false">Ver todas en bucle</button>
    <button class="pill" id="slow" aria-pressed="false">Carga lenta (6 s)</button>
  </div>
  <div class="grid" id="grid"></div>

<template id="cover">
  <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6b26b"/><stop offset=".55" stop-color="#d9507a"/><stop offset="1" stop-color="#46203f"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#sky)"/>
    <circle cx="68" cy="40" r="17" fill="#fff3d6" opacity=".92"/>
    <path d="M0 70 L22 48 L38 62 L55 40 L78 66 L100 52 V100 H0Z" fill="#2a1830"/>
    <path d="M0 82 L18 70 L40 80 L62 66 L100 84 V100 H0Z" fill="#160f15"/>
    <text x="7" y="16" font-family="system-ui,sans-serif" font-size="8" font-weight="800" fill="#fff" letter-spacing="-.3">BAFLE</text>
    <text x="7" y="24" font-family="system-ui,sans-serif" font-size="4.5" fill="#fff" opacity=".85">Atardecer en la sierra</text>
  </svg>
</template>

<script>
  const OPTIONS = [
    ["spinner", "0 · Spinner", "Lo que hay hoy."],
    ["breathe", "1 · Respira", "Se queda hundida, como el toque, y respira."],
    ["sway", "2 · Balanceo", "La funda se levanta y gira a un lado y a otro."],
    ["sheen", "3 · Brillo", "Se eleva y un reflejo la cruza."],
    ["disc", "4 · Disco", "El disco asoma de la funda y gira."],
    ["lift", "5 · Sube", "Se despega de la estantería y flota."],
  ];
  const grid = document.getElementById("grid");
  const cover = document.getElementById("cover");
  const tiles = OPTIONS.map(([kind, name, what]) => {
    const option = document.createElement("div");
    option.className = "option";
    option.innerHTML = `<button class="tile" data-kind="${kind}" data-state="idle" aria-label="${name}">
      <div class="stage">
        ${kind === "disc" ? '<div class="disc extra"></div>' : ""}
        <div class="cover"></div>
        ${kind === "sheen" ? '<div class="sheen extra"></div>' : ""}
        ${kind === "spinner" ? '<div class="spinner extra"></div>' : ""}
      </div></button>
      <p class="name">${name}</p><p class="what">${what}</p>`;
    option.querySelector(".cover").append(cover.content.cloneNode(true));
    grid.append(option);
    return option.querySelector(".tile");
  });

  let loadMs = 2600;
  const run = (tile) => {
    if (tile.dataset.state !== "idle") return;
    tile.dataset.state = "loading";
    setTimeout(() => {
      tile.dataset.state = "opening";
      setTimeout(() => {
        tile.dataset.state = "idle";
        if (looping) setTimeout(() => run(tile), 700);
      }, 900);
    }, loadMs);
  };
  tiles.forEach((tile) => tile.addEventListener("click", () => run(tile)));

  let looping = false;
  const all = document.getElementById("all");
  all.addEventListener("click", () => {
    looping = !looping;
    all.setAttribute("aria-pressed", String(looping));
    if (looping) tiles.forEach(run);
  });
  const slow = document.getElementById("slow");
  slow.addEventListener("click", () => {
    const on = slow.getAttribute("aria-pressed") !== "true";
    slow.setAttribute("aria-pressed", String(on));
    loadMs = on ? 6000 : 2600;
  });
</script>
</body>
</html>
