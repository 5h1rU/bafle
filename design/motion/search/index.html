<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Search · Bafle</title>
  <style>
    :root { color-scheme:dark; font:16px/1.3 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#160f15; color:#f5edf3; --muted:#b9abb6; --line:#40313c; --orchid:#ecc2e3; --ease:cubic-bezier(.4,0,.2,1); }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; height:100dvh; display:flex; overflow:hidden; }
    h1,h2,h3,p,figure,ul,li { margin:0; padding:0; }
    svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .defs { position:absolute; width:0; height:0; pointer-events:none; }
    .sidebar { width:224px; flex:none; padding:32px 16px; background:#201620; border-right:1px solid #34262f; }
    .brand { margin:0 12px 30px; font-size:25px; font-weight:700; letter-spacing:-1.15px; }
    .sidebar ul { display:grid; gap:5px; }
    nav li { display:flex; align-items:center; color:var(--muted); list-style:none; }
    .sidebar li { height:42px; padding-inline:13px; gap:12px; border-radius:9px; font-size:15px; font-weight:550; }
    .sidebar .active,.dock .active { background:#3b2036; color:var(--orchid); }
    main { position:relative; flex:1; min-width:0; height:100%; container-type:size; --edge:22px; --top:44px; }
    .intro,.search-position { position:absolute; left:var(--edge); right:var(--edge); margin:auto; width:auto; max-width:656px; text-align:center; }
    .intro { bottom:calc(50% + 42px); display:grid; justify-items:center; gap:12px; transition:opacity 90ms linear 150ms; pointer-events:none; }
    .bafle-mark { display:block; width:56px; height:76px; fill:#efdfec; stroke:none; }
    h1 { font-size:52px; line-height:1.06; letter-spacing:-2.8px; }
    .search-position { z-index:2; top:var(--top); transform:translateY(calc(50cqh - var(--top) - 28px)); transition:transform 280ms var(--ease); }
    .searchbox { height:56px; display:flex; align-items:center; gap:12px; padding:0 17px; border-radius:28px; background:#251b23; border:1px solid #574250; color:var(--muted); }
    .searchbox:focus-within { border-color:#a8809c; }
    .searchbox svg { flex:none; }
    input { min-width:0; flex:1; padding:0; outline:none; border:0; background:transparent; color:#f5edf3; font:inherit; }
    input::placeholder { color:var(--muted); opacity:1; }
    input::-webkit-search-cancel-button { display:none; }
    .clear { width:44px; height:44px; margin-right:-12px; display:grid; place-items:center; padding:0; border:0; background:none; cursor:pointer; color:#f5edf3; }
    .clear svg { padding:3px; border-radius:50%; background:#4b3a46; }
    [hidden] { display:none!important; }
    .message { position:absolute; top:100%; width:100%; margin-top:14px; color:var(--muted); font-size:14px; text-wrap:pretty; }
    .results { position:absolute; inset:calc(var(--top) + 84px) 0 0; padding:0 var(--edge) 32px; overflow:auto; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity 90ms linear,transform 90ms var(--ease); }
    .results-inner { max-width:824px; margin:0 auto; display:grid; grid-template-columns:1.05fr 1fr; gap:38px 30px; }
    main.docked .intro { opacity:0; transition-delay:0ms; }
    main.docked .search-position { transform:translateY(0); }
    main.docked .results { transform:none; opacity:1; pointer-events:auto; transition:opacity 170ms linear 140ms,transform 170ms var(--ease) 140ms; }
    .feature { position:relative; isolation:isolate; overflow:hidden; display:grid; align-content:end; min-height:207px; padding:22px; border-radius:17px; background:#352622; }
    .feature img { position:absolute; inset:0 0 0 auto; z-index:-2; width:64%; height:100%; object-fit:cover; }
    .feature::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,#352622 39%,#352622db 48%,#35262255 65%,#35262200 85%); }
    .feature p { font-size:13px; font-weight:550; color:#e2cac2; }
    .feature h2 { font-size:36px; letter-spacing:-1.6px; color:#fff6f1; }
    h2 { font-size:25px; letter-spacing:-.8px; }
    .albums { grid-column:1/-1; grid-row:2; }
    .results-inner:not(:has(.feature)) > section { grid-column:1/-1; grid-row:auto; }
    .tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:13px; }
    .tiles img { display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; margin-bottom:7px; }
    h3 { font-size:15px; font-weight:600; }
    figure h3 { font-size:14px; }
    small,time { color:var(--muted); font-size:12px; }
    .songs li { display:flex; align-items:center; gap:12px; min-height:50px; margin-top:6px; }
    .songs img { width:43px; border-radius:5px; }
    .songs time { margin-left:auto; font-variant-numeric:tabular-nums; }
    .sr-only { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; white-space:nowrap; }
    .dock { display:none; }
    @media(max-width:767px) {
      .sidebar { display:none; }
      main { --top:max(20px,env(safe-area-inset-top)); }
      .results { padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
      .results-inner { display:flex; flex-direction:column; gap:27px; }
      .feature { min-height:166px; }
      .tiles { gap:11px; }
      .dock { position:absolute; z-index:3; bottom:max(12px,env(safe-area-inset-bottom)); left:16px; right:16px; display:flex; gap:12px; pointer-events:none; }
      .dock ul,.dock .active { height:56px; border-radius:28px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); }
      .dock ul { flex:1; padding:0 6px; background:#251b23f5; }
      .dock li { flex:1; flex-direction:column; gap:3px; font-size:10px; }
      .dock li svg { width:17px; height:17px; }
      .dock .active { width:56px; border-color:#53364c; }
    }
    @media(max-height:510px) {
      .dock { display:none; }
      .bafle-mark { width:28px; height:38px; }
      .intro { bottom:calc(50% + 40px); }
      h1 { font-size:36px; }
    }
    @media(prefers-reduced-motion:reduce) {
      .intro,.search-position,.results,main.docked .results { transition:none; }
      .results { transform:none; }
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" class="defs" xmlns="http://www.w3.org/2000/svg">
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z M9 20v-7h6v7"/></symbol>
    <symbol id="new" viewBox="0 0 24 24"><path d="m10 3 2.4 6.6L19 12l-6.6 2.4L10 21l-2.4-6.6L1 12l6.6-2.4z M20 2v5m-2.5-2.5h5"/></symbol>
    <symbol id="genres" viewBox="0 0 24 24"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></symbol>
    <symbol id="radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><path d="M7.7 7.7a6 6 0 0 0 0 8.6m8.6 0a6 6 0 0 0 0-8.6M4.6 4.6a10.5 10.5 0 0 0 0 14.8m14.8 0a10.5 10.5 0 0 0 0-14.8"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
  </svg>
  <nav aria-label="Main" class="sidebar"><p class="brand">Bafle</p><ul></ul></nav>
  <main>
    <div class="intro">
      <svg class="bafle-mark" role="img" aria-label="Bafle" viewBox="0 0 196 266">
        <path fill-rule="evenodd" d="M15 0h166a15 15 0 0 1 15 15v236a15 15 0 0 1-15 15H15a15 15 0 0 1-15-15V15A15 15 0 0 1 15 0Z M69 53a29 29 0 1 0 58 0a29 29 0 1 0-58 0Z M85 53a13 13 0 1 0 26 0a13 13 0 1 0-26 0Z M19 174a79 79 0 1 0 158 0a79 79 0 1 0-158 0Z M64 174a34 34 0 1 0 68 0a34 34 0 1 0-68 0Z"/>
      </svg>
      <h1>Search</h1>
    </div>
    <div class="search-position">
      <div class="searchbox">
        <svg aria-hidden="true"><use href="#search"/></svg>
        <input type="search" aria-label="Search the catalog" placeholder="Artists, songs, albums, playlists" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="clear" aria-label="Clear search" hidden><svg aria-hidden="true"><use href="#close"/></svg></button>
      </div>
      <p class="message" aria-hidden="true"></p>
    </div>
    <section class="results" aria-label="Results" inert><div class="results-inner"></div></section>
    <nav aria-label="Main" class="dock"><ul></ul><span class="active" aria-label="Search"><svg aria-hidden="true"><use href="#search"/></svg></span></nav>
    <p class="sr-only" role="status"></p>
  </main>
  <script>
    const main = document.querySelector('main');
    const field = document.querySelector('input');
    const results = document.querySelector('.results');
    const list = document.querySelector('.results-inner');
    const status = document.querySelector('[role=status]');
    const message = document.querySelector('.message');
    const artwork = '../../artwork/';
    const artist = 'Bonobo';
    const albums = [
      {name:'Migration', cover:'migration', year:2017},
      {name:'Fragments', cover:'fragments', year:2022},
      {name:'Black Sands', cover:'black-sands', year:2010}
    ];
    const songs = [
      {name:'Kiara', album:'Black Sands', time:'3:50'},
      {name:'Second Sun', album:'Migration', time:'3:43'},
      {name:'Kong', album:'Black Sands', time:'3:57'}
    ];
    const icon = name => '<svg aria-hidden="true"><use href="#' + name + '"/></svg>';
    for (const item of ['Home','New','Genres','Radio','Search']) {
      const current = item === 'Search';
      const row = '<li' + (current ? ' class="active" aria-current="page"' : '') + '>' + icon(item.toLowerCase()) + item + '</li>';
      document.querySelector('.sidebar ul').insertAdjacentHTML('beforeend', row);
      if (!current) document.querySelector('.dock ul').insertAdjacentHTML('beforeend', row);
    }

    const clear = document.querySelector('.clear');
    if (window.visualViewport) {
      const sizeToViewport = () => { document.body.style.height = window.visualViewport.height + 'px'; };
      window.visualViewport.addEventListener('resize', sizeToViewport);
      sizeToViewport();
    }

    function renderMatches(term) {
      const matches = value => value.toLowerCase().includes(term.toLowerCase());
      const showArtist = matches(artist);
      const matchingAlbums = albums.filter(album => showArtist || matches(album.name));
      const matchingSongs = songs.filter(song => showArtist || matches(song.name) || matches(song.album));
      const found = showArtist || matchingAlbums.length > 0 || matchingSongs.length > 0;
      const artistCard = '<article class="feature"><img src="' + artwork + 'bonobo.jpg" alt=""><p>Artist</p><h2>Bonobo</h2></article>';
      const tiles = matchingAlbums.map(({name,cover,year}) => '<figure><img alt="" src="' + artwork + cover + '.jpg"><figcaption><h3>' + name + '</h3><small>' + year + '</small></figcaption></figure>');
      const rows = matchingSongs.map(({name,album,time}) => {
        const cover = albums.find(item => item.name === album).cover;
        return '<li><img src="' + artwork + cover + '.jpg" alt=""><div><h3>' + name + '</h3><small>Bonobo</small></div><time>' + time + '</time></li>';
      });
      list.innerHTML = (showArtist ? artistCard : '')
        + (tiles.length ? '<section class="albums"><h2>Albums</h2><div class="tiles">' + tiles.join('') + '</div></section>' : '')
        + (rows.length ? '<section class="songs"><h2>Songs</h2><ul>' + rows.join('') + '</ul></section>' : '');
      if (found) main.classList.add('docked');
      results.inert = !found;
      const announcement = found ? 'Results for “' + term + '”' : 'No results for “' + term + '”';
      message.textContent = found ? '' : announcement;
      status.textContent = announcement;
      results.removeAttribute('aria-busy');
      results.scrollTop = 0;
    }

    let pending;
    function search() {
      window.clearTimeout(pending);
      const term = field.value.trim();
      clear.hidden = field.value.length === 0;
      message.textContent = '';
      if (term) {
        results.setAttribute('aria-busy','true');
        // Local catalog, with a short simulated wait for the response.
        pending = window.setTimeout(() => renderMatches(term), 280);
        return;
      }
      results.removeAttribute('aria-busy');
      results.inert = true;
      main.classList.remove('docked');
      status.textContent = '';
    }
    function reset() {
      field.value = '';
      search();
      field.focus({preventScroll:true});
    }
    field.addEventListener('input',search);
    field.addEventListener('keydown',event => {
      if (event.key === 'Escape') { event.preventDefault(); reset(); }
    });
    clear.addEventListener('pointerdown', event => event.preventDefault());
    clear.addEventListener('click',reset);
  </script>
</body>
</html>
