<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The type the visual tests are drawn in. The app asks for the system's own
  (`system-ui` in styles.css), and a Linux with no word on it draws whatever
  font it has first: in Playwright's image, a Chinese face with no bold. CI
  installs Inter (`fonts-inter`) and puts this file in /etc/fonts/conf.d, so
  that the system's type is Inter there, as it is on the pictures.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
