    <meta name="color-scheme" content="light dark" />
    <!-- The colour a phone draws its own bar in, over the installed app: the ground of what is
         under it, so the two are one surface, light or dark. The page opens on the mark, so
         that is its ground at first; once the app has a page of its own to show, each takes the
         page's ground, which it carries here (`PaintSystemBar` in command.ts). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efdfec" data-canvas="#fbf7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#160f15" data-canvas="#160f15" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" sizes="any" media="(prefers-color-scheme: dark)" />
    <!-- One picture for every home screen, larger than any draws it: a phone
         only ever brings it down to size. It is the mark with its colours the
         other way round, the pale speaker on the deep aubergine. An iPhone,
         from iOS 26, keeps an icon's ground and fades what stands on it
         towards that ground: the dark speaker on the pale ground came out
         washed. Its source is design/apple-touch-icon.svg. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/monochrome.svg" color="#46203F" />

    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/1242x2208-dark.png" />
    <!-- The same mark while the app itself loads, in any browser: it is in the page, so it is
         there before the style sheet and the script are. It gives way when the first page has
         something of its own to show, not when the app first draws: that first drawing is only
         placeholders, and the mark stands over them. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        place-items: center;
        background: #efdfec;
        color: #46203f;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        /* Once it has given way it is not in the page at all. A browser that takes the colour of
           its own bars from what lies along the top of the page (Safari, from 26) reads it off
           a piece that is only clear, and this one is another tone than the page under it. */
        transition:
          opacity 220ms ease-out,
          visibility 0s 220ms,
          display 0s 220ms;
        transition-behavior: allow-discrete;
      }
      #splash svg {
        width: 34vw;
        max-width: 10rem;
        height: auto;
      }
      /* It shows for as long as the app's place stands empty beside it, and then for as long as
         the app, which takes that place over, says it is launching (`launch` in the Model).
         Anything else in that place, the page that says the app stopped among them, has no such
         word, and the mark gives way. */
      #root:empty + #splash,
      [data-launching] + #splash {
        display: grid;
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        --splash-play-state: running;
        transition: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        #splash .speaker {
          transform-box: fill-box;
          transform-origin: center bottom;
          animation: speaker-rock 1200ms ease-in-out infinite;
          animation-play-state: var(--splash-play-state, paused);
        }
        /* Each tilt lifts the opposite corner, then the cabinet lands on the beat. */
        @keyframes speaker-rock {
          0%, 42%, 50%, 92%, 100% { transform: none; }
          16% { transform: translateY(-4.5%) rotate(-7deg); }
          32%, 82% { transform: scale(1.025, 0.97); }
          66% { transform: translateY(-3.2%) rotate(5deg); }
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #160f15;
          color: #efdfec;
        }
      }
    </style>
