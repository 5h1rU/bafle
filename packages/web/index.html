    <!-- The same mark while the app itself loads, in any browser: it is in the page, so it is
         there before the style sheet and the script are. It gives way when the first page has
         something of its own to show, not when the app first draws: that first drawing is only
         placeholders, and the mark stands over them. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #efdfec;
        color: #46203f;
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 220ms ease-out,
          visibility 0s 220ms;
      }
      #splash svg {
        width: 30vw;
        max-width: 9rem;
        height: auto;
      }
      /* It shows for as long as the app's place stands empty beside it, and then for as long as
         the app, which takes that place over, says it is launching (`launch` in the Model).
         Anything else in that place, the page that says the app stopped among them, has no such
         word, and the mark gives way. */
      #root:empty + #splash,
      [data-launching] + #splash {
        visibility: visible;
        opacity: 1;
        transition: none;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #160f15;
          color: #efdfec;
        }
      }
    </style>
